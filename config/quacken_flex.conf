# The DesignWare I2C driver derives SCL timings from this value (in MHz) and
# defaults to 32, but the RP2040 clocks I2C from clk_sys (125 MHz): without
# this, the 100 kHz standard mode runs at ~400 kHz.
# Remove once https://github.com/Nuclear-Squid/zmk-keyboard-quacken/pull/79 is merged.
CONFIG_I2C_DW_CLOCK_SPEED=125
